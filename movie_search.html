<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .movie {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 15px;
        }
        img {
            width: 150px;
            height: auto;
        }
    </style>
</head>
<body>

<h1>Search for Movies</h1>

<!-- Search Bar Form -->
<form id="searchForm">
    <input type="text" id="search" name="search" placeholder="Search for movies...">
    <input type="text" id="year" name="year" placeholder="Year">
    <input type="text" id="genre" name="genre" placeholder="Genre">
    <button type="submit">Search</button>
</form>

<hr>

<!-- Movie Results will be dynamically loaded here -->
<div id="movieResults"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // When the search form is submitted
    $("#searchForm").submit(function(event) {
        event.preventDefault(); // Prevent the default form submission

        // Get the values of the inputs
        var search = $("#search").val();
        var year = $("#year").val();
        var genre = $("#genre").val();

        // Send the Ajax request
        $.ajax({
            url: 'movie_search.php', // Point to the PHP script
            type: 'GET',
            data: {
                search: search,
                year: year,
                genre: genre
            },
            success: function(response) {
                // Parse the JSON response from the PHP script
                var movies = JSON.parse(response);

                // Display the results
                var html = '';
                if (movies.length > 0) {
                    movies.forEach(function(movie) {
                        html += "<div class='movie'>";
                        html += "<a href='movie_detail.php?id=" + movie.movie_id + "'>" + movie.title + "</a>";
                        html += "<p><strong>Genre:</strong> " + movie.genre + "</p>";
                        html += "<p><strong>Director:</strong> " + movie.director + "</p>";
                        html += "<p><strong>Cast:</strong> " + movie.cast + "</p>";
                        html += "<p><strong>Plot:</strong> " + movie.plot + "</p>";
                        
                        // Check if the poster URL exists, if not, use a placeholder
                        var posterUrl = movie.poster_url ? movie.poster_url : 'https://via.placeholder.com/150'; // Placeholder if no poster URL
                        html += "<img src='" + posterUrl + "' alt='Poster'>";
                        
                        html += "</div>";
                    });
                } else {
                    html = "<p>No movies found.</p>";
                }
                
                // Update the #movieResults div with the results
                $("#movieResults").html(html);
            }
        });
    });
</script>

</body>
</html>
